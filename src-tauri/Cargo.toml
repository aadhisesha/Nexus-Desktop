[package]
name = "nexus"
version = "0.0.2"
description = "Nexus — AI-powered semantic file search engine"
authors = ["you"]
edition = "2021"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-shell = "2.4.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-http = "2.8.0"
tauri-plugin-fs = "2.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# This feature is used for production builds where `devPath` points to the
# filesystem and the built-in dev server is disabled.
custom-protocol = ["tauri/custom-protocol"]
